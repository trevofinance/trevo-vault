// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
	ext {
		kotlin_version = '1.9.22'
		compose_compiler_version = "1.5.8"
		compose_libs_version = "1.6.0"
		// CameraX 1.3.1 bundles a 4 KB-aligned native image-processing library,
		// which makes Play reject the app on 16 KB-page Android devices.
		androidx_camera_version = "1.4.2"
		accompanist_version = "0.32.0"
		coilVersion = "2.5.0"
	}
	repositories {
		google()
		mavenCentral()
		maven { url "https://plugins.gradle.org/m2/" }
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.13.1'
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
		classpath "org.mozilla.rust-android-gradle:plugin:0.9.6"
		// uniffi wants some build-time specific info from JNA
		classpath 'net.java.dev.jna:jna:5.12.1'
		// NOTE: Do not place your application dependencies here; they belong
		// in the individual module build.gradle files
	}
}

task clean(type: Delete) {
	delete rootProject.buildDir
}
