plugins {
	id 'com.android.application'
	id 'kotlin-android'
	id 'org.mozilla.rust-android-gradle.rust-android'
	id 'idea'
	// Firebase plugin disabled: upstream added for their Firebase project,
	// but Trevo does not use Firebase and package_name differs, so keep off to avoid build issues.
	// id 'com.google.gms.google-services'
}

apply plugin: 'kotlin-android'
// Firebase plugin disabled (see note above).
// apply plugin: 'com.google.gms.google-services'

android {
	defaultConfig {
		applicationId "finance.trevo.vault"
		minSdk 23
		targetSdk 35
		versionCode 16
		versionName "1.0.12"
		ndk {
			// MUST stay in sync with the cargo { targets } block below. 32-bit x86 was
			// listed here but is not a cargo target, so x86 splits shipped without
			// libsigner.so and crashed on launch with UnsatisfiedLinkError. 32-bit x86
			// Android is obsolete and Play has required 64-bit since 2019.
			abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
		}

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		vectorDrawables {
			useSupportLibrary true
		}
	}

	// Release signing. Credentials come from ~/.gradle/gradle.properties (never commit them):
	//   MYAPP_UPLOAD_STORE_FILE, MYAPP_UPLOAD_KEY_ALIAS,
	//   MYAPP_UPLOAD_STORE_PASSWORD, MYAPP_UPLOAD_KEY_PASSWORD
	// See RELEASE.md. Populate the config only when all four are present; the check that
	// a release must never be built unsigned lives on the signing tasks below, so it is
	// keyed on the actual artifact being produced rather than on command-line task names.
	signingConfigs {
		release {
			def requiredProps = ['MYAPP_UPLOAD_STORE_FILE', 'MYAPP_UPLOAD_KEY_ALIAS',
			                     'MYAPP_UPLOAD_STORE_PASSWORD', 'MYAPP_UPLOAD_KEY_PASSWORD']
			if (requiredProps.every { project.hasProperty(it) }) {
				storeFile file(MYAPP_UPLOAD_STORE_FILE)
				storePassword MYAPP_UPLOAD_STORE_PASSWORD
				keyAlias MYAPP_UPLOAD_KEY_ALIAS
				keyPassword MYAPP_UPLOAD_KEY_PASSWORD
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			signingConfig signingConfigs.release
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	kotlinOptions {
		jvmTarget = '11'
	}
	buildFeatures {
		compose true
		buildConfig true
	}
	composeOptions {
		kotlinCompilerExtensionVersion compose_compiler_version
	}
	packagingOptions {
		resources {
			excludes += '/META-INF/{AL2.0,LGPL2.1}'
		}
		jniLibs {
			pickFirsts += ['lib/armeabi-v7a/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so']
		}
	}
	// Compile with API 36 to satisfy androidx.core 1.17.0 requirements.
	compileSdk 36
	// NDK 28 for 16KB page-size support on newer devices.
	ndkVersion '28.2.13676358'
	namespace 'io.parity.signer'
}

android.applicationVariants.all { variant ->
	def uniffiPath = "${buildDir}/generated/source/uniffi/${variant.name}/java"
	def t = tasks.register("generate${variant.name.capitalize()}UniFFIBindings", Exec) {
		workingDir "${project.projectDir}"
		// Runs the bindings generation, note that you must have uniffi-bindgen installed and in your PATH environment variable
		commandLine 'uniffi-bindgen', 'generate', "${workingDir}/../rust/signer/src/signer.udl", '--language', 'kotlin', '--out-dir', uniffiPath
	}
	variant.javaCompileProvider.get().dependsOn(t)
	def sourceSet = variant.sourceSets.find { it.name == variant.name }
	sourceSet.java.srcDir new File(uniffiPath)
	// XXX: I've been trying to make this work but I can't, so the compiled bindings will show as "regular sources" in Android Studio.
	idea.module.generatedSourceDirs += file("${uniffiPath}/uniffi")
}
apply plugin: 'org.mozilla.rust-android-gradle.rust-android'

cargo {
	module = "../rust/signer"
	targetDirectory = "../rust/target"
	libname = "signer"
	targets = ["arm", "arm64", "x86_64"]
	apiLevel = 24 //NDK API level, not SDK
	profile = 'release'
	extraCargoBuildArguments = ["--locked"]
	// The plugin's linker wrapper shells out to this. It defaults to "python", which
	// does not exist on macOS 12+ (only python3), making cargoBuild* fail at the link
	// step with "python: command not found". See RELEASE.md troubleshooting.
	pythonCommand = "python3"
}

tasks.matching { it.name.matches(/merge.*JniLibFolders/) }.configureEach {
	it.inputs.dir(new File(buildDir, "rustJniLibs/android"))
	it.dependsOn("cargoBuild")
}

// A release must never be produced unsigned or debug-signed. Assert on the tasks that
// actually sign a release artifact (APK + AAB), so the check fires for `./gradlew build`
// or `assemble` too -- not just when a task named "*release*" is on the command line --
// and is NOT tripped by lint/unit-test tasks that merely have "release" in their name.
// Capture the config in script scope: inside a task's doFirst the `signingConfigs`
// name would resolve against the task, not the android extension.
def releaseSigningConfig = android.signingConfigs.release
tasks.matching { it.name in ['packageRelease', 'signReleaseBundle', 'packageReleaseUniversalApk'] }.configureEach {
	it.doFirst {
		def sf = releaseSigningConfig.storeFile
		if (sf == null) {
			throw new GradleException(
				"Release signing is not configured. Set MYAPP_UPLOAD_STORE_FILE, " +
				"MYAPP_UPLOAD_KEY_ALIAS, MYAPP_UPLOAD_STORE_PASSWORD and MYAPP_UPLOAD_KEY_PASSWORD " +
				"in ~/.gradle/gradle.properties. See RELEASE.md section 6.")
		}
		if (!sf.exists()) {
			throw new GradleException(
				"Release keystore not found at ${sf}. MYAPP_UPLOAD_STORE_FILE points at a " +
				"file that does not exist. See RELEASE.md.")
		}
	}
}

task buildDB (type: Exec) {
	commandLine './generate_database.sh'
}

dependencies {
	implementation "androidx.core:core-ktx:1.17.0"
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'com.google.android.material:material:1.11.0'
	implementation 'androidx.activity:activity-compose:1.8.2'
	implementation 'androidx.biometric:biometric:1.1.0'
	implementation "androidx.compose.ui:ui:$compose_libs_version"
	implementation "androidx.compose.material:material:$compose_libs_version"
	implementation "androidx.compose.material:material-icons-extended:$compose_libs_version"
	implementation "androidx.compose.ui:ui-tooling-preview:$compose_libs_version"
	implementation "com.google.accompanist:accompanist-permissions:$accompanist_version"
	implementation "androidx.datastore:datastore-preferences:1.0.0"
	implementation "androidx.navigation:navigation-compose:2.7.7"
	implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
	implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
	implementation 'androidx.security:security-crypto:1.1.0-alpha06'
	implementation 'androidx.security:security-crypto-ktx:1.1.0-alpha06'
	implementation "androidx.camera:camera-core:$androidx_camera_version"
	implementation "androidx.camera:camera-lifecycle:$androidx_camera_version"
	implementation "androidx.camera:camera-view:$androidx_camera_version"
	implementation "androidx.camera:camera-camera2:$androidx_camera_version"
	// TREVO: Bumped 17.2.0 -> 17.3.0 — 17.3.0 fixes 16KB page-size alignment (Google Play req.)
	implementation "com.google.mlkit:barcode-scanning:17.3.0"
	implementation "com.halilibo.compose-richtext:richtext-commonmark-android:0.20.0"
	implementation "com.halilibo.compose-richtext:richtext-ui-material-android:0.20.0"
	implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7"
	// TREVO: Bumped 5.13.0 -> 5.17.0 — 5.17.0 fixes libjnidispatch 16KB alignment crash on Android 15
	implementation "net.java.dev.jna:jna:5.17.0@aar"
	implementation "com.appmattus.crypto:cryptohash:0.10.1" //black2b hash for dot icon
	implementation "io.coil-kt:coil-compose:$coilVersion"
	implementation "io.coil-kt:coil-svg:$coilVersion"
	implementation 'com.jakewharton.timber:timber:5.0.1'
	testImplementation 'junit:junit:4.13.2'
	testImplementation "org.mockito:mockito-core:5.10.0"
	testImplementation "androidx.test:core:1.5.0"
	testImplementation "androidx.test.ext:junit:1.1.5"
	testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
	androidTestImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test.ext:junit:1.1.5'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
	androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_libs_version"
	debugImplementation "androidx.compose.ui:ui-tooling:$compose_libs_version"
	// Firebase BOM disabled: Trevo doesn't use Firebase; upstream config points to another package.
	// implementation platform('com.google.firebase:firebase-bom:33.12.0')
}

preBuild.dependsOn "cargoBuild","buildDB"
